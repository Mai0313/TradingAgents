name: Tests

# The diff decides whether the suite runs, never the branch name: a conventional-commits type says
# what a change is for and nothing about what it touched, so a `chore/`, `ci/` or `docs/` branch
# carrying code has to be tested like any other. Prose is what skips, and `**` comes first so a file
# type this repository grows later runs the suite from the day it arrives. The analyst prompts are
# not prose: `load_prompt` reads them at runtime and `tests/test_tool_registry.py` asserts on them.
on:
  push:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/tradingagents/agents/prompts/*.md"
  pull_request:
    branches:
      - main
      - master
      - release/*
    paths:
      - "**"
      - "!**/*.md"
      - "src/tradingagents/agents/prompts/*.md"

permissions: write-all

jobs:
  run_tests:
    name: Run Tests
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
        python-version:
          - "3.12"
          - "3.13"

    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          version: "latest"
          python-version: ${{ matrix.python-version }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install dependencies
        run: |
          uv python pin ${{ matrix.python-version }}
          uv sync --group test

      - name: Check for tests
        id: check_tests
        run: |
          if [ -f tests/test_*.py ] || [ -d tests ]; then
              echo "Tests exist, proceeding to run them."
              echo "has_tests=true" >> $GITHUB_OUTPUT
          else
              echo "No tests to run."
              echo "has_tests=false" >> $GITHUB_OUTPUT
          fi

      - name: Run pytest
        if: ${{ steps.check_tests.outputs.has_tests == 'true' }}
        run: |
          uv run pytest -vv | tee .coverage.txt

      - name: Pytest coverage comment
        if: ${{ steps.check_tests.outputs.has_tests == 'true' }}
        uses: MishaKav/pytest-coverage-comment@main
        with:
          pytest-coverage-path: ./.coverage.txt
          junitxml-path: ./.github/reports/.coverage.pytest.xml
          pytest-xml-coverage-path: ./.github/reports/coverage.xml
          unique-id-for-comment: ${{ matrix.python-version }}-${{ matrix.os }}
          title: Coverage for Python ${{ matrix.python-version }} on ${{ matrix.os }}
          hide-emoji: true
